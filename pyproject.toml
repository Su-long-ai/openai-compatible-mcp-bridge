[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-compatible-mcp-bridge"
version = "0.1.0"
description = "Expose an OpenAI-compatible chat endpoint as MCP tools"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.0",
]
license = {text = "MIT"}
authors = [{name = "Sulong"}]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Su-long-ai/openai-compatible-mcp-bridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
